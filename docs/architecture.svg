<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="620" viewBox="0 0 1600 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="process" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="intel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#94A3B8"/>
    </marker>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#E5E7EB}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#CBD5E1;font-size:16px}
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800}
      .nodeTitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;font-weight:700;fill:#F8FAFC}
      .nodeSub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#D1D5DB}
    </style>
  </defs>

  <rect width="1600" height="620" rx="26" fill="url(#bg)"/>
  <rect x="24" y="24" width="1552" height="572" rx="22" fill="none" stroke="#334155" stroke-width="1"/>

  <text x="70" y="78" class="title" font-size="34" fill="url(#title)">BITTRACE AI · SOLUTION ARCHITECTURE</text>
  <text x="70" y="108" class="small">SIH26146 · Blockchain &amp; Cybersecurity · Offline-first investigation pipeline</text>
  <line x1="70" y1="132" x2="1530" y2="132" stroke="#26364A" stroke-width="2"/>

  <!-- Input lane -->
  <rect x="70" y="198" width="205" height="82" rx="14" fill="url(#input)" filter="url(#shadow)"/>
  <text x="172" y="228" text-anchor="middle" class="nodeTitle">NETWORK DATA</text>
  <text x="172" y="251" text-anchor="middle" class="nodeSub">CSV · JSON · XML</text>
  <text x="172" y="269" text-anchor="middle" class="nodeSub">IP · Port · Time · ASN</text>

  <rect x="70" y="350" width="205" height="82" rx="14" fill="url(#input)" filter="url(#shadow)"/>
  <text x="172" y="380" text-anchor="middle" class="nodeTitle">BLOCKCHAIN DATA</text>
  <text x="172" y="403" text-anchor="middle" class="nodeSub">TXID · Wallet · Amount</text>
  <text x="172" y="421" text-anchor="middle" class="nodeSub">Fee · Script Type</text>

  <!-- Main pipeline -->
  <rect x="330" y="274" width="170" height="96" rx="14" fill="url(#process)" filter="url(#shadow)"/>
  <text x="415" y="304" text-anchor="middle" class="nodeTitle">NORMALIZATION</text>
  <text x="415" y="328" text-anchor="middle" class="nodeSub">Validate</text>
  <text x="415" y="348" text-anchor="middle" class="nodeSub">Deduplicate · Clean</text>

  <rect x="555" y="274" width="170" height="96" rx="14" fill="url(#process)" filter="url(#shadow)"/>
  <text x="640" y="304" text-anchor="middle" class="nodeTitle">CROSS-LAYER</text>
  <text x="640" y="328" text-anchor="middle" class="nodeSub">IP ↔ TXID ↔ Wallet</text>
  <text x="640" y="348" text-anchor="middle" class="nodeSub">Temporal Correlation</text>

  <rect x="780" y="274" width="170" height="96" rx="14" fill="url(#process)" filter="url(#shadow)"/>
  <text x="865" y="304" text-anchor="middle" class="nodeTitle">EVIDENCE GRAPH</text>
  <text x="865" y="328" text-anchor="middle" class="nodeSub">Entities + Links</text>
  <text x="865" y="348" text-anchor="middle" class="nodeSub">Provenance + Context</text>

  <rect x="1005" y="274" width="170" height="96" rx="14" fill="url(#intel)" filter="url(#shadow)"/>
  <text x="1090" y="304" text-anchor="middle" class="nodeTitle">AI / ML + GRAPH</text>
  <text x="1090" y="328" text-anchor="middle" class="nodeSub">Anomaly · Clustering</text>
  <text x="1090" y="348" text-anchor="middle" class="nodeSub">Temporal · Patterns</text>

  <rect x="1230" y="274" width="150" height="96" rx="14" fill="url(#output)" filter="url(#shadow)"/>
  <text x="1305" y="304" text-anchor="middle" class="nodeTitle">RISK + EVIDENCE</text>
  <text x="1305" y="328" text-anchor="middle" class="nodeSub">Explainable</text>
  <text x="1305" y="348" text-anchor="middle" class="nodeSub">Lead Prioritization</text>

  <rect x="1435" y="274" width="95" height="96" rx="14" fill="url(#output)" filter="url(#shadow)"/>
  <text x="1482" y="304" text-anchor="middle" class="nodeTitle" font-size="15">INVESTIGATE</text>
  <text x="1482" y="329" text-anchor="middle" class="nodeSub">Dashboard</text>
  <text x="1482" y="349" text-anchor="middle" class="nodeSub">Graph · Reports</text>

  <!-- arrows -->
  <path d="M275 239 C305 239 305 300 330 300" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M275 391 C305 391 305 344 330 344" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="322" x2="555" y2="322" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="725" y1="322" x2="780" y2="322" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="950" y1="322" x2="1005" y2="322" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1175" y1="322" x2="1230" y2="322" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1380" y1="322" x2="1435" y2="322" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Bottom capability rail -->
  <rect x="70" y="492" width="1460" height="58" rx="15" fill="#0F172A" stroke="#334155"/>
  <text x="105" y="527" class="small" font-weight="700">CORE CAPABILITIES</text>
  <text x="300" y="527" class="small">⚡ Bulk Ingestion</text>
  <text x="500" y="527" class="small">🔗 Cross-Layer Correlation</text>
  <text x="760" y="527" class="small">🕸 Evidence Graph</text>
  <text x="970" y="527" class="small">🧠 AI/ML Detection</text>
  <text x="1185" y="527" class="small">🎯 Explainable Leads</text>
  <text x="1390" y="527" class="small">🐧 Offline</text>
</svg>